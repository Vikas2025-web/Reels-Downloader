kind = "web"
previewPath = "/"
title = "Insta Grabber"
version = "1.0.0"
id = "artifacts/insta-grabber"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19178

[services.development]
run = "pnpm --filter @workspace/insta-grabber run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/insta-grabber", "run", "build" ]
publicDir = "artifacts/insta-grabber/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19178"
BASE_PATH = "/"
